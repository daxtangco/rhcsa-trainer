id: containers/030-container-web-service
title: Serve a directory from a rootless container that survives a reboot
chapter: 26
scope: exam-objective
rhel: 9
objectives:
  - containers.lifecycle.run
  - containers.service.run
  - containers.storage.persistent
  - containers.systemd.autostart
requires_concepts:
  - containers.rootless-vs-rootful
  - containers.quadlet-and-user-units
  - containers.volume-labels-and-z
difficulty: 4
time_budget: 1200
weight: high
# r9 only, and deliberately so. The whole "Manage containers" section is gone in
# RHEL 10: content/objectives-rhel10.yaml drops all eight containers.* ids and
# the RHCSA 10 Cert Guide has no containers chapter at all. Claiming [r9, r10]
# here would tell the scheduler this is durable core material when it is exactly
# the opposite - it is risk R2's blast radius (spec section 14.4), the material a
# student sitting the RHEL 10 exam should not be spending review time on.
editions: [r9]
# MUST be true. The one mistake this task exists to catch - a user unit that is
# enabled but whose user has no lingering enabled - looks completely correct
# before the reboot: the container is up, the unit is enabled, curl works. Only
# verdict B separates "it runs because I started it" from "it runs because the
# machine brought it back".
reboot_check: true
requires_disks: 0
transport: ssh
prompt: |
  The web team needs a static site served from this machine, and local policy is
  that application services do not run as root.

  /srv/webcontent already holds the site's index.html. The team keeps editing
  files in that directory, so whatever is in it must be what the site serves -
  a copy taken at build time is not acceptable.

  Publish that directory over HTTP on port 8080 of this host, out of a container,
  so that `curl http://localhost:8080/` returns the file. The image is already
  pulled on this machine: registry.access.redhat.com/ubi9/httpd-24, which listens
  on container port 8080 and serves whatever is in /var/www/html.

  It must satisfy all of this:

  - The container belongs to the unprivileged user student, not to root.
  - The site comes back on its own after a reboot, with nobody logging in.
  - SELinux stays in enforcing mode and the container stays confined by it:
    turning labelling off for the container is not an answer.
